<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="740" height="270" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Customer Support Agent architecture</title>
  <desc>A user chats with the Customer Support Agent in Agent Management. The agent reaches the Products MCP server through an MCP proxy, and Anthropic through an LLM provider, both on the Agent Management gateway. The Products MCP server reads the Products API; both run in Integration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b3f4a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="740" height="270" rx="12" fill="#ffffff"/>
  <g stroke="#3b3f4a" fill="#ffffff" stroke-width="1.2">
    <!-- User -->
    <rect x="15" y="85" width="75" height="44" rx="8"/>
    <!-- Agent Management -->
    <rect x="110" y="20" width="340" height="232" rx="10" fill="none" stroke="#6b4fe0" stroke-dasharray="6 4"/>
    <rect x="125" y="80" width="140" height="54" rx="8"/>
    <rect x="295" y="55" width="140" height="182" rx="8" fill="#f1edff" stroke="#6b4fe0"/>
    <rect x="307" y="85" width="116" height="44" rx="6"/>
    <rect x="307" y="172" width="116" height="50" rx="6"/>
    <!-- Integration -->
    <rect x="475" y="20" width="250" height="160" rx="10" fill="none" stroke="#e86a00" stroke-dasharray="6 4"/>
    <rect x="490" y="80" width="100" height="54" rx="8"/>
    <rect x="615" y="80" width="100" height="54" rx="8"/>
    <!-- Anthropic -->
    <rect x="475" y="207" width="160" height="40" rx="8" stroke-dasharray="3 3"/>
  </g>
  <g fill="#1f2328" text-anchor="middle">
    <text x="52" y="112">User</text>
    <text x="195" y="104">Customer Support</text><text x="195" y="120">Agent</text>
    <text x="365" y="112">MCP proxy</text>
    <text x="365" y="193">Anthropic LLM</text><text x="365" y="209">provider</text>
    <text x="540" y="104">Products</text><text x="540" y="120">MCP server</text>
    <text x="665" y="112">Products API</text>
    <text x="555" y="232">Anthropic (Claude)</text>
  </g>
  <text x="120" y="40" fill="#6b4fe0" font-weight="600">Agent Management</text>
  <text x="365" y="74" fill="#6b4fe0" font-weight="600" font-size="12" text-anchor="middle">Gateway</text>
  <text x="485" y="40" fill="#e86a00" font-weight="600">Integration</text>
  <g stroke="#3b3f4a" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <line x1="90" y1="107" x2="123" y2="107"/>
    <line x1="265" y1="107" x2="305" y2="107"/>
    <path d="M195,134 L195,197 L305,197"/>
    <line x1="423" y1="107" x2="488" y2="107"/>
    <line x1="590" y1="107" x2="613" y2="107"/>
    <line x1="423" y1="197" x2="473" y2="222"/>
  </g>
</svg>
